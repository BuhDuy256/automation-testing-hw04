name: HW06 FR-08 Newman CI Sample

on:
  push:
    branches:
      - hw06-api-testing
    paths:
      - .github/workflows/hw06-fr08-ci.yml
      - work/ci/fr08/**
      - package.json
      - package-lock.json
      - eshop-sut/backend/**
  workflow_dispatch:

jobs:
  fr08-ci-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            eshop-sut/backend/package-lock.json

      - name: Install Newman dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix eshop-sut/backend

      - name: Start and verify EShop backend
        shell: bash
        run: |
          cd eshop-sut/backend
          node server.js > ../../backend.log 2>&1 &
          echo $! > ../../backend.pid
          cd ../..
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/products > /dev/null; then
              echo "Backend ready on 127.0.0.1:3000"
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Run FR-08 CI demonstration sample
        run: |
          mkdir -p ci-artifacts
          npx newman run work/ci/fr08/FR08-ci-demo.postman_collection.json \
            --environment work/ci/fr08/FR08-ci-demo.postman_environment.json \
            --iteration-data work/ci/fr08/FR08-ci-demo.postman_data.json \
            --reporters cli,json,htmlextra \
            --reporter-json-export ci-artifacts/newman-report.json \
            --reporter-htmlextra-export ci-artifacts/newman-report.html

      - name: Preserve Newman and backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw06-fr08-ci-newman
          path: |
            ci-artifacts/newman-report.json
            ci-artifacts/newman-report.html
            backend.log
          if-no-files-found: error
          retention-days: 30
